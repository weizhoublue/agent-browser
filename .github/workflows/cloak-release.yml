# Manual release: sync upstream vercel-labs/agent-browser main → fork main,
# rebase cloak onto main, build agent-browser binaries, publish GitHub Release + release/<tag> branch.
name: Welan Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for GitHub Release and release/<tag> branch (e.g. v0.27.0-cloak.1)"
        required: true
        type: string

concurrency:
  group: cloak-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  workflows: write

env:
  UPSTREAM_REPO: vercel-labs/agent-browser
  FORK_REPO: weizhoublue/agent-browser
  ENHANCEMENT_BRANCH: cloak

jobs:
  prepare:
    name: Sync upstream, rebase cloak, push branches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_branch: ${{ steps.meta.outputs.release_branch }}
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize release tag
        id: meta
        run: |
          set -euo pipefail
          RAW="${{ inputs.release_tag }}"
          RAW="${RAW#"${RAW%%[![:space:]]*}"}"
          RAW="${RAW%"${RAW##*[![:space:]]}"}"
          if [ -z "$RAW" ]; then
            echo "::error::release_tag is empty"
            exit 1
          fi
          if [[ "$RAW" =~ ^v ]]; then
            TAG="$RAW"
          else
            TAG="v${RAW}"
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_branch=release/${TAG}" >> "$GITHUB_OUTPUT"
          echo "GitHub Release tag: ${TAG}"

      - name: Fetch remotes
        run: |
          set -euo pipefail
          git fetch origin --prune
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git" \
            || git remote set-url upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream main --force
          if ! git rev-parse upstream/main >/dev/null 2>&1; then
            echo "::error::upstream/main not found on https://github.com/${{ env.UPSTREAM_REPO }}"
            exit 1
          fi
          git log -1 --oneline upstream/main

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream main to fork main
        run: |
          git push --force origin "upstream/main:main"

      - name: Rebase cloak onto local main
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/remotes/origin/${{ env.ENHANCEMENT_BRANCH }}"; then
            echo "::error::Branch origin/${{ env.ENHANCEMENT_BRANCH }} not found on fork"
            exit 1
          fi
          git checkout -B "${{ env.ENHANCEMENT_BRANCH }}" "origin/${{ env.ENHANCEMENT_BRANCH }}"
          if ! git rebase main; then
            echo "::error::Rebase of '${{ env.ENHANCEMENT_BRANCH }}' onto main failed (conflicts). Resolve locally, then re-run."
            git rebase --abort || true
            git status
            exit 1
          fi
          git push origin "${{ env.ENHANCEMENT_BRANCH }}" --force-with-lease

  build-binaries:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agent-browser-linux-amd64
            use_zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: agent-browser-linux-arm64
            use_zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agent-browser-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Checkout cloak branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ENHANCEMENT_BRANCH }}
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --locked

      - name: Configure Rust linkers (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          shared-key: cloak-release-${{ needs.prepare.outputs.release_tag }}

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Build with cargo
        if: '!matrix.use_zigbuild'
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Package agent-browser binary
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SRC="cli/target/${{ matrix.target }}/release/agent-browser"
          DEST="artifacts/${{ matrix.artifact }}"
          cp "$SRC" "$DEST"
          chmod +x "$DEST"
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cloak (required by gh release)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.ENHANCEMENT_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          path: dist/
          pattern: agent-browser-*
          merge-multiple: true

      - name: Verify binaries
        run: |
          set -euo pipefail
          EXPECTED=(
            agent-browser-linux-amd64
            agent-browser-linux-arm64
            agent-browser-darwin-arm64
          )
          MIN_SIZE=100000
          ERR=0
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Missing dist/$f"
              ERR=1
              continue
            fi
            SIZE=$(stat -c%s "dist/$f")
            if [ "$SIZE" -lt "$MIN_SIZE" ]; then
              echo "::error::dist/$f too small ($SIZE bytes)"
              ERR=1
            else
              echo "OK dist/$f ($SIZE bytes)"
              sha256sum "dist/$f" >> dist/SHA256SUMS
            fi
          done
          [ "$ERR" -eq 0 ]
          cat dist/SHA256SUMS

      - name: Write release notes
        env:
          TAG: ${{ needs.prepare.outputs.release_tag }}
          BRANCH: ${{ needs.prepare.outputs.release_branch }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          FORK_REPO: ${{ env.FORK_REPO }}
          ENHANCEMENT_BRANCH: ${{ env.ENHANCEMENT_BRANCH }}
        run: |
          set -euo pipefail
          {
            echo "## agent-browser ${TAG}"
            echo
            echo "- **Upstream sync**: [\`${UPSTREAM_REPO}\`](https://github.com/${UPSTREAM_REPO}) \`main\` → fork \`main\`"
            echo "- **Release label**: \`${TAG}\` (GitHub Release + \`${BRANCH}\`, not upstream tag pin)"
            echo "- **Enhancements**: \`${ENHANCEMENT_BRANCH}\` rebased onto \`main\` (CloakBrowser-Manager CDP + Bearer)"
            echo "- **Archive branch**: \`${BRANCH}\`"
            echo "- **Binaries**: \`agent-browser\` (platform-specific release filenames)"
            echo
            echo "### Assets"
            echo
            echo "| File | Platform |"
            echo "|------|----------|"
            echo "| \`agent-browser-linux-amd64\` | Linux x86_64 |"
            echo "| \`agent-browser-linux-arm64\` | Linux ARM64 |"
            echo "| \`agent-browser-darwin-arm64\` | macOS Apple Silicon |"
            echo
            echo "Verify checksums: \`sha256sum -c SHA256SUMS\`"
            echo
            echo "Usage: [get-started.md](https://github.com/${FORK_REPO}/blob/${BRANCH}/get-started.md)"
          } > /tmp/release-notes.md

      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.release_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets (clobber)..."
            gh release upload "$TAG" dist/agent-browser-* dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "agent-browser ${TAG}" \
              --notes-file /tmp/release-notes.md \
              dist/agent-browser-* dist/SHA256SUMS
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push archival branch release/<tag>
        run: |
          set -euo pipefail
          BRANCH="${{ needs.prepare.outputs.release_branch }}"
          git checkout -B "$BRANCH"
          git push origin "$BRANCH" --force
          echo "Archived source snapshot at origin/${BRANCH}"
