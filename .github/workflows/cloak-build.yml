# Manual build: checkout any ref (branch / commit / tag), build agent-browser for 3 platforms, upload CI artifacts.
name: Welan Build Binary

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, commit SHA, or tag). Default: cloak"
        required: false
        default: cloak
        type: string

concurrency:
  group: cloak-build-${{ github.repository }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agent-browser-linux-amd64
            use_zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: agent-browser-linux-arm64
            use_zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agent-browser-darwin-arm64
            use_zigbuild: false

    steps:
      - name: Resolve ref
        id: meta
        run: |
          set -euo pipefail
          RAW="${{ inputs.ref }}"
          RAW="${RAW#"${RAW%%[![:space:]]*}"}"
          RAW="${RAW%"${RAW##*[![:space:]]}"}"
          if [ -z "$RAW" ]; then
            RAW="cloak"
          fi
          echo "ref=${RAW}" >> "$GITHUB_OUTPUT"
          echo "Building ref: ${RAW}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 1

      - name: Print resolved commit
        run: git log -1 --oneline

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --locked

      - name: Configure Rust linkers (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          shared-key: cloak-build-${{ steps.meta.outputs.ref }}

      - name: Build with zigbuild
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Build with cargo
        if: '!matrix.use_zigbuild'
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Package agent-browser binary
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SRC="cli/target/${{ matrix.target }}/release/agent-browser"
          DEST="artifacts/${{ matrix.artifact }}"
          cp "$SRC" "$DEST"
          chmod +x "$DEST"
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          retention-days: 14

  verify-artifacts:
    name: Verify uploaded artifacts
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          path: dist/
          pattern: agent-browser-*
          merge-multiple: true

      - name: Verify binaries
        run: |
          set -euo pipefail
          EXPECTED=(
            agent-browser-linux-amd64
            agent-browser-linux-arm64
            agent-browser-darwin-arm64
          )
          MIN_SIZE=100000
          ERR=0
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Missing dist/$f"
              ERR=1
              continue
            fi
            SIZE=$(stat -c%s "dist/$f")
            if [ "$SIZE" -lt "$MIN_SIZE" ]; then
              echo "::error::dist/$f too small ($SIZE bytes)"
              ERR=1
            else
              echo "OK dist/$f ($SIZE bytes)"
              sha256sum "dist/$f" >> dist/SHA256SUMS
            fi
          done
          [ "$ERR" -eq 0 ]
          cat dist/SHA256SUMS

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: agent-browser-bundle-${{ github.run_id }}
          path: dist/
          retention-days: 14
